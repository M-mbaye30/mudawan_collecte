<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mudawan · مُدوَّنة</title>
  <meta name="description" content="Collecte participative de paires de phrases wolof–arabe.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,500&family=Noto+Naskh+Arabic:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">
      <span class="brand-ar" lang="ar">مُدوَّنة</span>
      <span class="brand-sub" data-i18n="brand_sub"></span>
    </a>
    <nav class="nav">
      <a href="./" data-nav="contribute" data-i18n="nav_contribute"></a>
      <a href="review.html" id="nav-review" data-nav="review" data-i18n="nav_review" hidden></a>
      <button type="button" class="link-btn" id="lang-btn" data-i18n="lang_switch"></button>
      <button type="button" class="link-btn" id="signout-btn" data-i18n="sign_out" hidden></button>
    </nav>
  </header>

  <p class="demo-notice" id="demo-notice" data-i18n="demo_notice" hidden></p>

  <main>
    <!-- Ouverture : une vraie paire du corpus, en vis-à-vis -->
    <section class="hero" aria-labelledby="hero-caption">
      <p class="caption" id="hero-caption" data-i18n="hero_caption"></p>
      <div class="facing facing-display">
        <p class="side side-wo" lang="wo" dir="ltr" id="hero-wo"></p>
        <span class="spine" aria-hidden="true"></span>
        <p class="side side-ar" lang="ar" dir="rtl" id="hero-ar"></p>
      </div>
      <p class="purpose" data-i18n="purpose"></p>
      <dl class="stats" id="stats">
        <div><dt data-i18n="stat_validated"></dt><dd id="stat-validated">–</dd></div>
        <div><dt data-i18n="stat_pending"></dt><dd id="stat-pending">–</dd></div>
        <div><dt data-i18n="stat_contributors"></dt><dd id="stat-contributors">–</dd></div>
      </dl>
    </section>

    <!-- Formulaire : même vis-à-vis, cette fois à remplir -->
    <section class="contribute" aria-labelledby="form-title">
      <h2 id="form-title" data-i18n="form_title"></h2>

      <form id="pair-form" novalidate>
        <fieldset class="facing facing-input">
          <label class="side side-wo">
            <span class="side-label" data-i18n="side_wolof"></span>
            <textarea name="wolof" lang="wo" dir="ltr" rows="4" required data-i18n-ph="ph_wolof"></textarea>
          </label>
          <span class="spine" aria-hidden="true"></span>
          <label class="side side-ar">
            <span class="side-label" data-i18n="side_arabic"></span>
            <textarea name="arabic" lang="ar" dir="rtl" rows="4" required data-i18n-ph="ph_arabic"></textarea>
          </label>
        </fieldset>

        <div class="meta-grid">
          <fieldset class="field">
            <legend data-i18n="label_origin"></legend>
            <label class="choice"><input type="radio" name="origin" value="human_native" checked> <span data-i18n="origin_human_native"></span></label>
            <label class="choice"><input type="radio" name="origin" value="published"> <span data-i18n="origin_published"></span></label>
            <label class="choice"><input type="radio" name="origin" value="mt_postedit"> <span data-i18n="origin_mt_postedit"></span></label>
          </fieldset>

          <label class="field">
            <span data-i18n="label_domain"></span>
            <select name="domain">
              <option value="religion" data-i18n="domain_religion"></option>
              <option value="news" data-i18n="domain_news"></option>
              <option value="daily" data-i18n="domain_daily"></option>
              <option value="education" data-i18n="domain_education"></option>
              <option value="literature" data-i18n="domain_literature"></option>
              <option value="other" data-i18n="domain_other"></option>
            </select>
          </label>

          <label class="field">
            <span><span data-i18n="label_source_title"></span> <span class="opt" id="source-opt" data-i18n="optional"></span></span>
            <input type="text" name="source_title" data-i18n-ph="ph_source_title">
          </label>

          <label class="field">
            <span><span data-i18n="label_source_url"></span> <span class="opt" data-i18n="optional"></span></span>
            <input type="url" name="source_url" dir="ltr" placeholder="https://">
          </label>

          <label class="field" id="license-field" hidden>
            <span data-i18n="label_license"></span>
            <select name="license">
              <option value="unknown" data-i18n="license_unknown"></option>
              <option value="cc_by" data-i18n="license_cc_by"></option>
              <option value="cc_by_sa" data-i18n="license_cc_by_sa"></option>
              <option value="cc_by_nc" data-i18n="license_cc_by_nc"></option>
              <option value="public_domain" data-i18n="license_public_domain"></option>
            </select>
          </label>
        </div>

        <label class="consent" id="consent-field">
          <input type="checkbox" name="consent">
          <span data-i18n="consent"></span>
        </label>

        <p class="form-error" id="form-error" role="alert"></p>
        <button type="submit" class="primary" id="submit-btn" data-i18n="submit"></button>
      </form>

      <!-- Affiché à la place du bouton tant qu'on n'est pas connecté -->
      <form class="signin" id="signin-form" hidden>
        <h3 data-i18n="signin_title"></h3>
        <p data-i18n="signin_help"></p>
        <div class="signin-row">
          <label class="visually-hidden" for="signin-email" data-i18n="email_label"></label>
          <input type="email" id="signin-email" dir="ltr" required autocomplete="email" placeholder="name@example.org">
          <button type="submit" class="primary" data-i18n="send_link"></button>
        </div>
        <p class="signin-sent" role="status"></p>
      </form>
    </section>

    <section class="mine" id="mine" aria-labelledby="mine-title" hidden>
      <h2 id="mine-title" data-i18n="mine_title"></h2>
      <ol class="pair-list" id="mine-list"></ol>
    </section>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="assets/contribute.js"></script>
</body>
</html>
